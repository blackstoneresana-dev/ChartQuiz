<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChartQuiz — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260722">
  <meta name="theme-color" content="#ffffff">
<!-- Init thème avant rendu (évite le flash) -->
<script>(function(){const s=localStorage.getItem('chartquiz-theme');const d=s==='dark';if(d)document.documentElement.setAttribute('data-theme','dark');const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?'#0a0a0f':'#ffffff';})();</script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChartQuiz">
</head>
<body>

<noscript>
  <div style="background:rgba(255,77,106,0.1);border:1px solid rgba(255,77,106,0.3);border-radius:10px;padding:1rem 1.25rem;margin:1rem;color:#ff4d6a;font-family:sans-serif;font-size:14px;">
    JavaScript est requis pour utiliser ChartQuiz.
  </div>
</noscript>

<div class="container auth-container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">Chart<span>Quiz</span></div>
    <button class="theme-btn" id="theme-btn" aria-label="Changer le thème">☽</button>
  </div>

  <!-- AUTH CARD -->
  <div class="auth-card">

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" data-tab="login">Connexion</button>
      <button class="auth-tab" id="tab-signup" data-tab="signup">Inscription</button>
    </div>

    <!-- MESSAGE D'ERREUR -->
    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <!-- MESSAGE DE SUCCÈS -->
    <div id="auth-success" class="auth-success" style="display:none;"></div>

    <!-- FORMULAIRE CONNEXION -->
    <form class="auth-form" id="form-login">
      <div class="auth-field">
        <label class="auth-label" for="login-email">Email</label>
        <input
          class="auth-input"
          type="email"
          id="login-email"
          placeholder="trader@example.com"
          required
          autocomplete="email"
        >
      </div>
      <div class="auth-field">
        <label class="auth-label" for="login-password">Mot de passe</label>
        <input
          class="auth-input"
          type="password"
          id="login-password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>
      <button class="submit-btn" type="submit" id="login-btn">Se connecter</button>
      <button type="button" class="auth-link" id="forgot-link">Mot de passe oublié ?</button>
    </form>

    <!-- FORMULAIRE MOT DE PASSE OUBLIÉ (demande de lien) -->
    <form class="auth-form" id="form-forgot" style="display:none;">
      <div class="auth-field">
        <label class="auth-label" for="forgot-email">Email</label>
        <input
          class="auth-input"
          type="email"
          id="forgot-email"
          placeholder="trader@example.com"
          required
          autocomplete="email"
        >
      </div>
      <button class="submit-btn" type="submit" id="forgot-btn">Envoyer le lien</button>
      <button type="button" class="auth-link" id="back-to-login">← Retour à la connexion</button>
    </form>

    <!-- FORMULAIRE NOUVEAU MOT DE PASSE (après clic sur le lien recovery) -->
    <form class="auth-form" id="form-reset" style="display:none;">
      <div class="auth-field">
        <label class="auth-label" for="reset-password">Nouveau mot de passe</label>
        <input
          class="auth-input"
          type="password"
          id="reset-password"
          placeholder="8 caractères minimum"
          required
          autocomplete="new-password"
          minlength="8"
        >
      </div>
      <button class="submit-btn" type="submit" id="reset-btn">Définir le mot de passe</button>
    </form>

    <!-- FORMULAIRE INSCRIPTION -->
    <form class="auth-form" id="form-signup" style="display:none;">
      <div class="auth-field">
        <label class="auth-label" for="signup-pseudo">Pseudo</label>
        <input
          class="auth-input"
          type="text"
          id="signup-pseudo"
          placeholder="TonPseudo"
          maxlength="32"
          autocomplete="nickname"
        >
      </div>
      <div class="auth-field">
        <label class="auth-label" for="signup-email">Email</label>
        <input
          class="auth-input"
          type="email"
          id="signup-email"
          placeholder="trader@example.com"
          required
          autocomplete="email"
        >
      </div>
      <div class="auth-field">
        <label class="auth-label" for="signup-password">Mot de passe</label>
        <input
          class="auth-input"
          type="password"
          id="signup-password"
          placeholder="8 caractères minimum"
          required
          autocomplete="new-password"
          minlength="8"
        >
      </div>
      <button class="submit-btn" type="submit" id="signup-btn">Créer mon compte</button>
    </form>

  </div><!-- /auth-card -->

</div><!-- /container -->

<!-- CDN Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Logique DB + Auth -->
<script src="js/supabase.js"></script>
<!-- Logique page auth -->
<script src="js/auth.js"></script>

</body>
</html>
