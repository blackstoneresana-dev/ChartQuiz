<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChartQuiz — What Do You Do</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>(function(){const s=localStorage.getItem('chartquiz-theme');if(s==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body>

<noscript>
  <div style="background:rgba(255,77,106,0.1);border:1px solid rgba(255,77,106,0.3);border-radius:10px;padding:1rem 1.25rem;margin:1rem;color:#ff4d6a;font-family:sans-serif;font-size:14px;">
    JavaScript est requis pour utiliser ChartQuiz.
  </div>
</noscript>

<!-- FULLSCREEN OVERLAY -->
<div class="chart-fullscreen" id="chart-fullscreen">
  <button class="chart-fullscreen-close" id="chart-fullscreen-close" aria-label="Fermer">✕</button>
  <img class="chart-fullscreen-img" id="chart-fullscreen-img" src="" alt="" />
</div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- SIDEBAR PANEL -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Navigation</span>
    <button class="sidebar-close" id="sidebar-close" aria-label="Fermer">✕</button>
  </div>
  <nav class="sidebar-nav">
    <a class="sidebar-item" href="index.html">
      <span class="sidebar-item-icon"><svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <div>
        <div class="sidebar-item-name">Accueil</div>
        <div class="sidebar-item-desc">Choisir un quiz</div>
      </div>
    </a>
    <div class="sidebar-section-label">Général</div>
    <a class="sidebar-item" href="dashboard.html">
      <span class="sidebar-item-icon"><svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span>
      <div>
        <div class="sidebar-item-name">Dashboard</div>
        <div class="sidebar-item-desc">Mes statistiques</div>
      </div>
    </a>
    <div class="sidebar-section-label">Sessions</div>
    <a class="sidebar-item" href="quiz.html">
      <span class="sidebar-item-icon"><svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></span>
      <div>
        <div class="sidebar-item-name">Direction Quiz</div>
        <div class="sidebar-item-desc">Prédire la direction du marché</div>
      </div>
    </a>
    <a class="sidebar-item" href="post-analysis.html">
      <span class="sidebar-item-icon"><svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      <div>
        <div class="sidebar-item-name">Post Analysis</div>
        <div class="sidebar-item-desc">Analyser après coup</div>
      </div>
    </a>
    <a class="sidebar-item active" href="what-do-you-do.html">
      <span class="sidebar-item-icon"><svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
      <div>
        <div class="sidebar-item-name">What Do You Do</div>
        <div class="sidebar-item-desc">Réagir en temps réel</div>
      </div>
    </a>
  </nav>
</aside>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu sessions">
      <span></span><span></span><span></span>
    </button>
    <div class="logo">Chart<span>Quiz</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="user-badge" id="user-badge"></span>
      <button class="logout-btn" id="logout-btn" aria-label="Déconnexion" title="Déconnexion">⎋</button>
      <button class="theme-btn" id="theme-btn" aria-label="Changer le thème">☽</button>
    </div>
  </div>

  <!-- CHARGEMENT -->
  <div id="loading-state" style="text-align:center;padding:3rem 0;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;">
    Chargement…
  </div>

  <!-- ERREUR -->
  <div id="error-state" style="display:none;background:rgba(255,77,106,0.08);border:1px solid rgba(255,77,106,0.3);border-radius:10px;padding:1rem 1.25rem;color:var(--down);font-size:13px;margin-bottom:1.5rem;"></div>

  <!-- MAIN -->
  <div id="wtd-main" class="hidden">

    <!-- HEADER QUIZ : label + camembert -->
    <div class="quiz-header-row">
      <div class="question-label" id="wtd-question-label"></div>
      <svg class="progress-pie" width="52" height="52" viewBox="0 0 44 44">
        <circle class="pie-bg"  cx="22" cy="22" r="17"/>
        <circle class="pie-arc" id="pie-fill" cx="22" cy="22" r="17"
                stroke-dasharray="0 106.8"
                transform="rotate(-90 22 22)"/>
        <text id="pie-text" class="pie-text" x="22" y="22">1/5</text>
      </svg>
    </div>
    <div class="question-text" id="wtd-question-text"></div>

    <!-- GRAPHIQUE AVANT -->
    <span class="chart-tag tag-avant">AVANT</span>
    <div class="chart-wrap">
      <img class="chart-img" loading="lazy" decoding="async" id="chart-avant" src="" alt="Graphique AVANT" />
    </div>

    <!-- OPTIONS (rendu dynamique par JS) -->
    <div class="options-row">
      <div class="options-label">Que fais-tu ?</div>
      <div class="wtd-options" id="wtd-options"></div>
    </div>

    <!-- BOUTON VALIDER -->
    <button class="submit-btn" id="submit-btn" disabled>
      Valider ma réponse
    </button>

    <!-- SECTION RÉSULTAT -->
    <div class="result-section" id="wtd-result-section">

      <hr class="divider">

      <!-- BANDEAU -->
      <div class="result-banner" id="wtd-result-banner">
        <span class="result-icon" id="wtd-result-icon"></span>
        <div>
          <div class="result-title" id="wtd-result-title"></div>
          <div class="result-sub"   id="wtd-result-sub"></div>
        </div>
      </div>

      <!-- GRAPHIQUE APRÈS -->
      <span class="chart-tag tag-apres">APRÈS</span>
      <div class="chart-wrap">
        <img class="chart-img" loading="lazy" decoding="async" id="chart-apres" src="" alt="Graphique APRÈS" />
        </div>

      <!-- GRAPHIQUE EXPLICATION -->
      <span class="chart-tag tag-expl">EXPLICATION</span>
      <div class="chart-wrap">
        <img class="chart-img" loading="lazy" decoding="async" id="chart-expl" src="" alt="Graphique EXPLICATION" />
        </div>

      <!-- ANALYSE -->
      <div class="expl-box">
        <div class="expl-title">Analyse</div>
        <ul class="expl-list" id="wtd-expl-list"></ul>
      </div>

      <!-- BOUTON SUIVANT -->
      <button class="next-btn" id="next-btn" style="display:none;">Situation suivante →</button>

    </div><!-- /wtd-result-section -->

  </div><!-- /wtd-main -->

  <!-- SESSION END -->
  <div class="session-end" id="wtd-session-end">
    <div class="score-banner">
      <div class="score-num" id="wtd-score-num"></div>
      <div class="score-sub" id="wtd-score-sub"></div>
    </div>
    <button class="submit-btn" id="restart-btn" style="margin-top:1.5rem;">Nouvelle session →</button>
  </div>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/what-do-you-do.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
