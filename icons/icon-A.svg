<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="90" y1="160" x2="422" y2="160" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="90" y1="230" x2="422" y2="230" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="90" y1="300" x2="422" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="90" y1="370" x2="422" y2="370" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Candle 1 — bearish (red), left -->
  <!-- Wick -->
  <line x1="148" y1="178" x2="148" y2="370" stroke="#ff4d6a" stroke-width="5" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="122" y="230" width="52" height="100" rx="6" fill="#ff4d6a" opacity="0.85"/>

  <!-- Candle 2 — neutral (muted), center-left -->
  <!-- Wick -->
  <line x1="234" y1="200" x2="234" y2="360" stroke="rgba(255,255,255,0.25)" stroke-width="5" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="208" y="255" width="52" height="65" rx="6" fill="rgba(255,255,255,0.18)"/>

  <!-- Candle 3 — bullish (green), center-right -->
  <!-- Wick -->
  <line x1="320" y1="170" x2="320" y2="350" stroke="#00c896" stroke-width="5" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="294" y="200" width="52" height="110" rx="6" fill="#00c896" opacity="0.9"/>

  <!-- Arrow UP — purple, right side, with glow -->
  <g filter="url(#glow)">
    <!-- Arrow shaft -->
    <line x1="406" y1="360" x2="406" y2="188" stroke="#7c6aff" stroke-width="18" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="406,148 366,210 446,210" fill="#7c6aff"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="180" y="430" width="152" height="4" rx="2" fill="#7c6aff" opacity="0.6"/>
</svg>
