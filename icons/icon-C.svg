<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9180ff"/>
      <stop offset="100%" style="stop-color:#5a4ae0"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle shine overlay top -->
  <rect width="512" height="260" rx="112" fill="url(#shineGrad)"/>

  <!-- Decorative chart line (subtle, bottom) -->
  <polyline
    points="56,400 140,340 210,370 290,290 370,310 456,240"
    fill="none"
    stroke="rgba(255,255,255,0.12)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- CQ text -->
  <text
    x="256"
    y="300"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="220"
    letter-spacing="-8"
    fill="white"
    opacity="0.97">CQ</text>

  <!-- Small dot accent under text -->
  <circle cx="256" cy="400" r="12" fill="rgba(255,255,255,0.4)"/>
</svg>
